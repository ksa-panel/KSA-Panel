<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>KSA Panel</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #061f2b;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow-x: hidden;
}

.page {
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background: #061f2b;
}

.visual {
    position: relative;

    width: min(100vw, 1024px);

    aspect-ratio: 1024 / 1536;

    background-image: url("background.png");

    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center top;
}


/* =========================
   ORDER NOW BUTTON
========================= */

.order-button {
    position: absolute;

    left: 17.5%;
    top: 47.7%;

    width: 65%;
    height: 6.3%;

    border: none;
    border-radius: 999px;

    background: transparent;

    cursor: pointer;

    z-index: 10;
}


/* =========================
   TRANSACTION INPUT
========================= */

.transaction-input {
    position: absolute;

    left: 20.5%;
    top: 77.3%;

    width: 59%;
    height: 4.8%;

    border: none;
    outline: none;

    background: transparent;

    color: white;

    font-size: 16px;

    padding: 0 20px;

    z-index: 20;
}


/* =========================
   SUBMIT BUTTON
========================= */

.submit-button {
    position: absolute;

    left: 20%;
    top: 84.7%;

    width: 60%;
    height: 5%;

    border: none;
    border-radius: 999px;

    background: transparent;

    cursor: pointer;

    z-index: 10;
}


/* =========================
   MESSAGE
========================= */

.message {
    position: fixed;

    left: 50%;
    bottom: 20px;

    transform: translateX(-50%);

    display: none;

    padding: 10px 18px;

    border-radius: 30px;

    background: rgba(0,0,0,.75);

    color: white;

    font-size: 14px;

    z-index: 100;
}


/* Desktop */

@media (min-width: 1025px) {

    .visual {
        box-shadow:
        0 0 60px rgba(0,0,0,.4);
    }

}
</style>
</head>


<body>

<div class="page">

    <main class="visual">

        <!-- ORDER NOW -->
        <button
            class="order-button"
            id="orderButton"
            aria-label="Order Now">
        </button>


        <!-- TRANSACTION ID -->
        <input
            type="text"
            id="transactionId"
            class="transaction-input"
            placeholder=""
            autocomplete="off"
            aria-label="Transaction ID or bKash Number"
        >


        <!-- SUBMIT -->
        <button
            class="submit-button"
            id="submitButton"
            aria-label="Submit">
        </button>

    </main>

</div>


<div id="message" class="message"></div>


<script>

/* =========================
   SETTINGS
========================= */

const WHATSAPP_NUMBER = "8801832137297";


/* =========================
   MESSAGE FUNCTION
========================= */

function showMessage(text) {

    const message =
        document.getElementById("message");

    message.innerText = text;

    message.style.display = "block";

    setTimeout(() => {

        message.style.display = "none";

    }, 2500);
}


/* =========================
   ORDER NOW
========================= */

document
.getElementById("orderButton")
.addEventListener("click", function () {

    /*
       এখানে তোমার আসল Order Now
       / bKash payment link বসাবে।

       Example:

       window.location.href =
       "https://example.com";
    */

    showMessage("Order Now clicked");

});


/* =========================
   SUBMIT → WHATSAPP
========================= */

document
.getElementById("submitButton")
.addEventListener("click", function () {

    const transactionId =
        document
        .getElementById("transactionId")
        .value
        .trim();


    /* Empty check */

    if (!transactionId) {

        showMessage(
            "Transaction ID দিন"
        );

        document
        .getElementById("transactionId")
        .focus();

        return;
    }


    /* WhatsApp message */

    const message =
        "KSA PANEL Order\n\n" +
        "Transaction ID / bKash Number: " +
        transactionId;


    /* WhatsApp URL */

    const whatsappURL =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(message);


    /* Open WhatsApp */

    window.location.href = whatsappURL;

});

</script>

</body>
</html>
