<body>
<div class="page">
<main class="visual">
<button class="order-button" id="orderButton" aria-label="Order Now"></button>
<input id="transactionId" class="transaction-input" type="text" autocomplete="off" aria-label="Transaction ID or bKash Number">
<button class="submit-button" id="submitButton" aria-label="Submit"></button>
</main>
</div>
<div id="message" class="message"></div>
<script>
const msg=document.getElementById("message");
function showMessage(t){msg.textContent=t;msg.style.display="block";setTimeout(()=>msg.style.display="none",2500)}

document.getElementById("orderButton").onclick=()=>{
  showMessage("Order Now clicked");
};

document.getElementById("submitButton").onclick=()=>{
  const id=document.getElementById("transactionId").value.trim();
  if(!id){
    showMessage("Transaction ID দিন");
    document.getElementById("transactionId").focus();
    return;
  }
  const text="KSA PANEL Order\n\nTransaction ID / bKash Number: "+id;
  window.location.href="https://wa.me/8801832137297?text="+encodeURIComponent(text);
};
</script>
